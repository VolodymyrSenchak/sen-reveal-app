      <input type="text" inputmode="numeric" maxlength="1" value="3" aria-label="Code digit 5" style="box-sizing: border-box; width: 100%; height: 68px; padding: 0; text-align: center; border-radius: 16px; background: #221B33; border: 1.5px solid #4A3E63; color: #F7F3FF; font-family: 'Space Mono', monospace; font-size: 26px; font-weight: 700;">

    <label for="joinnick" style="font-size: 13.5px; font-weight: 600; color: #CFC6E3;">Your nickname</label>
